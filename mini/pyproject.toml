[project]
name = "mini"
version = "0.0.1"
description = "从零复刻的 agent harness 练习工程（配套《pi-vs-tau 架构对比学习指南》第 9 章）"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_ai", "src/mini_agent", "src/mini_app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["mini_ai", "mini_agent", "mini_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
